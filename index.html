<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Misi Kejujuran 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#87c9e8}#hud{position:fixed;z-index:5;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}.card{background:#fffffff2;border:1px solid #d8e1d6;border-radius:14px;padding:8px 11px;box-shadow:0 3px 12px #0002}.card b{display:block}.small{font-size:12px;color:#526058}.wide{min-width:210px;flex:1}.meter{height:7px;background:#e5eae3;border-radius:8px;overflow:hidden;margin-top:5px}.meter>i{display:block;height:100%;background:#3b825c;width:0}#hint{position:fixed;z-index:6;left:50%;top:88px;transform:translateX(-50%);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;box-shadow:0 4px 15px #0003;pointer-events:none}#arrow{position:fixed;z-index:6;left:50%;top:50%;font-size:52px;text-shadow:0 3px 8px #0005;pointer-events:none;transition:transform .15s}#arrow span{display:block;font-size:12px;background:#fff;padding:4px 8px;border-radius:8px;text-align:center;margin-top:-6px}#controls{position:fixed;z-index:7;bottom:15px;left:15px;display:grid;grid-template-columns:repeat(3,52px);gap:6px}button{border:0;border-radius:13px;min-height:48px;background:#fffffff0;font-weight:800;cursor:pointer;box-shadow:0 2px 8px #0002}button:active{transform:scale(.96)}#controls button:nth-child(1){grid-column:2}#controls button:nth-child(2){grid-column:1}#controls button:nth-child(3){grid-column:2}#controls button:nth-child(4){grid-column:3}#actions{position:fixed;z-index:7;bottom:15px;right:15px;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.modal{position:fixed;inset:0;z-index:20;background:#0007;display:flex;align-items:center;justify-content:center;padding:18px}.panel{max-width:620px;width:100%;background:#fff;border-radius:22px;padding:20px;box-shadow:0 12px 40px #0005}.panel h2{margin:0 0 8px}.choices{display:grid;gap:9px;margin-top:14px}.choices button{text-align:left;padding:12px;background:#f3f6f2;box-shadow:none;border:1px solid #dbe3d8}.choices button:hover{background:#e8f1e8}.hidden{display:none!important}#start{background:linear-gradient(135deg,#eaf7e7,#fff6dc)}#start input{width:100%;padding:13px;border:1px solid #ccd8ca;border-radius:12px;font-size:16px;margin:10px 0}#message{margin-top:10px;padding:10px;border-radius:12px;background:#eef7ec}.pause{opacity:.8}
</style>
</head>
<body>
<div id="hud">
<div class="card"><span class="small">👤 Pemain</span><b id="playerName">Murid</b></div>
<div class="card"><span class="small">⭐ Mata Kejujuran</span><b id="score">0</b></div>
<div class="card"><span class="small">🎯 Misi</span><b id="progress">0 / 7</b></div>
<div class="card wide"><span class="small">Objektif: <b id="objective">Mulakan permainan</b></span><div class="meter"><i id="bar"></i></div></div>
</div>
<div id="hint">Ikut anak panah 🧭</div><div id="arrow">⬆<span id="arrowText">Lokasi seterusnya</span></div>
<div id="controls"><button data-k="w">▲</button><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div>
<div id="actions"><button id="talk">💬 Bercakap</button><button id="guide">🧭 Pandu</button><button id="pause">Ⅱ Jeda</button></div>
<div id="modal" class="modal"><div class="panel" id="start"><h1>🏡 Misi Kejujuran 3D</h1><p>Terokai Kampung Seri Harmoni, bergerak dari satu lokasi ke lokasi lain dan selesaikan 7 situasi kejujuran.</p><input id="nameInput" maxlength="24" placeholder="Masukkan nama pemain"><button id="startBtn" style="width:100%;background:#397b59;color:#fff">Mula Pengembaraan</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8bcbe8);scene.fog=new THREE.Fog(0x8bcbe8,35,120);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,180);camera.position.set(0,5,9);
scene.add(new THREE.HemisphereLight(0xffffff,0x6c8a55,2.1));const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(25,35,15);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(150,150),new THREE.MeshStandardMaterial({color:0x73aa60}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const roadMat=new THREE.MeshStandardMaterial({color:0xc7ad7f});function road(x,z,w,d){const m=new THREE.Mesh(new THREE.BoxGeometry(w,.08,d),roadMat);m.position.set(x,.03,z);scene.add(m)}road(0,0,7,150);road(0,0,150,7);
const mats={wall:new THREE.MeshStandardMaterial({color:0xf0d2a5}),roof:new THREE.MeshStandardMaterial({color:0xa75a48}),wood:new THREE.MeshStandardMaterial({color:0x76523a}),glass:new THREE.MeshStandardMaterial({color:0x8fd1df}),green:new THREE.MeshStandardMaterial({color:0x477b4d})};
function box(g,m,x,y,z,sx=1,sy=1,sz=1){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=o.receiveShadow=true;scene.add(o);return o}
function tree(x,z){box(new THREE.CylinderGeometry(.35,.5,2.6,8),mats.wood,x,1.3,z);const l=box(new THREE.SphereGeometry(1.6,10,8),mats.green,x,3,z);l.scale.set(1,1.1,1)}
function house(x,z,name){box(new THREE.BoxGeometry(7,4.2,6),mats.wall,x,2.1,z);const roof=box(new THREE.ConeGeometry(5.1,2.8,4),mats.roof,x,5.4,z);roof.rotation.y=Math.PI/4;box(new THREE.BoxGeometry(1.25,2.1,.2),mats.wood,x,1.05,z-3.05);[-2,2].forEach(dx=>box(new THREE.BoxGeometry(1.4,1.2,.18),mats.glass,x+dx,2.3,z-3.08));const label=makeText(name);label.position.set(x,6.8,z);label.lookAt(camera.position);scene.add(label)}
function makeText(t){const c=document.createElement('canvas');c.width=512;c.height=96;const ctx=c.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,512,96);ctx.fillStyle='#234';ctx.font='bold 42px sans-serif';ctx.textAlign='center';ctx.fillText(t,256,62);const tx=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tx}));s.scale.set(7,1.3,1);return s}
[[ -18,-18,'Rumah Ibu'],[18,-18,'Rumah Amir'],[-18,18,'Rumah Siti'],[18,18,'Perpustakaan']].forEach(v=>house(...v));for(let x=-30;x<=30;x+=10){tree(x,-10);tree(x,10)}for(let z=-30;z<=30;z+=10){tree(-10,z);tree(10,z)}
const locations=[
{name:'Rumah Ibu',p:new THREE.Vector3(-18,0,-18),q:'Kamu ternampak wang tercicir di rumah. Apakah tindakan kamu?',a:[['Simpan kerana tiada siapa nampak.',-2,'Kejujuran tetap penting walaupun tiada orang melihat.'],['Beritahu ibu dan cari pemiliknya.',3,'Betul! Kamu menjaga hak orang lain.'],['Biarkan sahaja.',0,'Lebih baik bertindak apabila mengetahui perkara penting.']]},
{name:'Rumah Amir',p:new THREE.Vector3(18,0,-18),q:'Kamu tidak menyiapkan kerja sekolah. Apa yang patut kamu katakan?',a:[['Beri alasan yang tidak benar.',-2,'Alasan palsu bukan tindakan jujur.'],['Mengaku belum siap dan minta peluang.',3,'Bagus! Berani mengakui kesilapan ialah kejujuran.'],['Salin kerja rakan.',-1,'Meniru bukan cara jujur.']]},
{name:'Kedai Kampung',p:new THREE.Vector3(0,0,-30),q:'Penjaga kedai memberi baki lebih. Apakah pilihan kamu?',a:[['Simpan wang itu.',-2,'Wang lebihan bukan milik kamu.'],['Pulangkan wang lebihan.',3,'Tepat! Kamu memulangkan hak orang lain.'],['Ambil sebahagian.',-1,'Ia tetap bukan hak kamu.']]},
{name:'Taman Seri Harmoni',p:new THREE.Vector3(-30,0,0),q:'Kamu tertendang bola hingga pasu pecah. Apa kamu buat?',a:[['Salahkan orang lain.',-2,'Menutup kesilapan dengan penipuan bukan jujur.'],['Mengaku dan minta maaf.',3,'Hebat! Kamu bertanggungjawab.'],['Lari supaya tiada siapa tahu.',-1,'Melarikan diri tidak menyelesaikan masalah.']]},
{name:'Rumah Siti',p:new THREE.Vector3(-18,0,18),q:'Kamu melihat rakan mengambil barang yang bukan miliknya. Apa tindakan kamu?',a:[['Diam sahaja.',-1,'Kamu boleh membantu dengan menasihati rakan.'],['Nasihati rakan supaya memulangkan barang.',3,'Betul! Kamu menggalakkan kejujuran.'],['Ikut mengambil barang.',-2,'Kesalahan orang lain bukan alasan untuk kita buat perkara sama.']]},
{name:'Perpustakaan',p:new THREE.Vector3(18,0,18),q:'Kamu mendapati buku perpustakaan rosak selepas menggunakannya. Apa kamu buat?',a:[['Sembunyikan kerosakan.',-2,'Menyembunyikan kesilapan bukan jujur.'],['Beritahu guru dan minta maaf.',3,'Bagus! Kamu bertanggungjawab.'],['Letak semula tanpa memberitahu.',-1,'Lebih baik berterus terang supaya buku dapat dibaiki.']]},
{name:'Peti Amanah',p:new THREE.Vector3(0,0,30),q:'Kamu menemui barang berharga tanpa nama pemilik. Apa tindakan terbaik?',a:[['Ambil untuk diri sendiri.',-3,'Barang itu bukan automatik menjadi milik kita.'],['Serahkan kepada orang dewasa untuk mencari pemilik.',4,'Tahniah! Kamu menjaga amanah dan hak orang lain.'],['Sembunyikan barang itu.',-2,'Kejujuran memerlukan kita menjaga barang orang lain.']]}
];
let player=new THREE.Group();const body=box(new THREE.CylinderGeometry(.55,.7,1.5,10),new THREE.MeshStandardMaterial({color:0x3b6fa3}),0,0,0);body.position.set(0,.9,0);body.parent=player;const head=box(new THREE.SphereGeometry(.52,16,12),new THREE.MeshStandardMaterial({color:0xf1c29a}),0,2,0);head.parent=player;const hair=box(new THREE.SphereGeometry(.56,16,8),new THREE.MeshStandardMaterial({color:0x33251e}),0,2.3,0);hair.parent=player;player.position.set(0,0,5);scene.add(player);
const npc=box(new THREE.SphereGeometry(.7,16,12),new THREE.MeshStandardMaterial({color:0xf1c29a}),0,1.4,0);npc.position.set(0,0,-1);scene.add(npc);
let idx=0,score=0,paused=false,moving={w:false,a:false,s:false,d:false};const $=id=>document.getElementById(id);
function update(){ $('score').textContent=score;$('progress').textContent=idx+' / 7';$('bar').style.width=(idx/7*100)+'%';if(idx<7){$('objective').textContent='Pergi ke '+locations[idx].name;$('arrowText').textContent=locations[idx].name}}
function distance(){return player.position.distanceTo(locations[idx].p)}
function orient(){if(idx>=7)return;const target=locations[idx].p.clone();target.y=1.2;const v=target.clone().sub(player.position);$('arrow').style.transform='translate(-50%,-50%) rotate('+Math.atan2(v.x,v.z)+'rad)';}
function move(dt){if(paused||idx>=7)return;const speed=8;const dir=new THREE.Vector3((moving.d?1:0)-(moving.a?1:0),0,(moving.s?1:0)-(moving.w?1:0));if(dir.length()){dir.normalize();player.position.addScaledVector(dir,speed*dt);player.position.x=THREE.MathUtils.clamp(player.position.x,-45,45);player.position.z=THREE.MathUtils.clamp(player.position.z,-45,45)}if(distance()<5){npc.position.copy(locations[idx].p);npc.y=0;orient()}}
function question(){if(idx>=7||distance()>7){$('hint').textContent='🚶 Bergerak lebih dekat ke lokasi dahulu.';setTimeout(()=>$('hint').textContent='Ikut anak panah 🧭',1600);return}const q=locations[idx];$('modal').classList.remove('hidden');$('modal').innerHTML='<div class="panel"><h2>🎯 '+q.name+'</h2><p>'+q.q+'</p><div class="choices">'+q.a.map((a,i)=>'<button data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+a[0]+'</button>').join('')+'</div></div>';document.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>answer(q.a[+b.dataset.i]))}
function answer(a){score+=a[1];score=Math.max(0,score);idx++;$('modal').innerHTML='<div class="panel"><h2>'+(a[1]>0?'🌟 Pilihan jujur!':'💭 Mari belajar daripada pilihan ini.')+'</h2><p>'+a[2]+'</p><button id="continue" style="width:100%;background:#397b59;color:#fff">'+(idx<7?'Teruskan perjalanan':'Lihat keputusan')+'</button></div>';$('continue').onclick=()=>{if(idx>=7){$('modal').innerHTML='<div class="panel"><h2>🏆 Misi Kejujuran Selesai!</h2><p><b>'+($('playerName').textContent)+'</b>, kamu telah menyelesaikan semua 7 misi.</p><p>⭐ Mata Kejujuran: <b>'+score+'</b></p><p>Ingat: kejujuran membina kepercayaan dan menjaga hak orang lain.</p><button id="close" style="width:100%;background:#397b59;color:#fff">Tutup</button></div>';$('close').onclick=()=>{$('modal').classList.add('hidden')};$('arrow').classList.add('hidden')}else{$('modal').classList.add('hidden');$('hint').textContent='➡️ Misi seterusnya dibuka. Ikut anak panah.';update()}};update()}
$('startBtn').onclick=()=>{const n=$('nameInput').value.trim()||'Murid';$('playerName').textContent=n;$('modal').classList.add('hidden');update()};$('talk').onclick=question;$('guide').onclick=()=>{$('hint').textContent='🧭 Ikut anak panah dan bergerak ke lokasi yang ditunjukkan.'};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶ Sambung':'Ⅱ Jeda';$('hint').textContent=paused?'⏸ Permainan dijeda':'Ikut anak panah 🧭'};
document.querySelectorAll('#controls button').forEach(b=>{b.onpointerdown=()=>moving[b.dataset.k]=true;b.onpointerup=b.onpointercancel=()=>moving[b.dataset.k]=false});addEventListener('keydown',e=>{const k={w:'w',ArrowUp:'w',a:'a',ArrowLeft:'a',s:'s',ArrowDown:'s',d:'d',ArrowRight:'d'}[e.key];if(k)moving[k]=true;if(e.key===' '){e.preventDefault();question()}});addEventListener('keyup',e=>{const k={w:'w',ArrowUp:'w',a:'a',ArrowLeft:'a',s:'s',ArrowDown:'s',d:'d',ArrowRight:'d'}[e.key];if(k)moving[k]=false});
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.04,(t-(loop.last||t))/1000);loop.last=t;move(dt);orient();const target=player.position.clone().add(new THREE.Vector3(0,4.5,8));camera.position.lerp(target,.08);camera.lookAt(player.position.x,1.4,player.position.z);renderer.render(scene,camera)}requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});update();
</script>
</body></html>
